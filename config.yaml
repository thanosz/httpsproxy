# HTTP Proxy Configuration

# Server settings
server:
  # HTTPS server port
  port: 8443
  # Path to TLS certificate file
  cert_file: server.crt
  # Path to TLS key file
  key_file: server.key

# Syslog settings
syslog:
  # Syslog facility and priority
  priority: "LOG_INFO|LOG_DAEMON"
  # Syslog tag/identifier
  tag: "httpsproxy"

# Proxy settings
proxy:
  # Default timeout for TCP connections (in seconds)
  dial_timeout: 10
  # Default destination for CONNECT method tunneling (leave empty to use requested host)
  tunnel_destination: "10.0.0.1:22"

# Route configurations
routes:
  # Host-based proxy route
  - name: "app"
    host_contains: "app.example.com"
    tls_termination: true   # backend speaks plain HTTP
    target_host: "192.168.1.10:8080"

  # Host-based 301 redirect
  - name: "old-app"
    host_contains: "old.example.com"
    redirect_url: "https://app.example.com"
    redirect_status: 301

  # Host-based proxy with original host passthrough
  - name: "passthrough"
    host_contains: "passthrough.example.com"
    # tls_termination: false (default) — backend speaks HTTPS
    use_original_host: true

  # Host-based proxy to internal service
  - name: "monitor"
    host_contains: "monitor.example.com"
    tls_termination: true   # backend speaks plain HTTP
    target_host: "192.168.1.1:8080"

# Default behavior
default:
  # HTTP status code for denied requests
  denied_status: 403
  # Message for denied requests
  denied_message: "Forbidden"

